services:
  db:
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:5.7.44}
    container_name: ai-workflow-db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  app:
    build:
      context: .
      dockerfile: ai-mid-platform/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.12.3-bookworm}
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-mirrors.aliyun.com}
        NODEJS_DIST_MIRROR: ${NODEJS_DIST_MIRROR:-https://npmmirror.com/mirrors/node}
    container_name: ai-workflow-app
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      - db
    ports:
      - "3002:3002"

  web:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20.20.0-bookworm}
        NGINX_BASE_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.24.0}
    container_name: ai-workflow-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"

volumes:
  mysql_data:
