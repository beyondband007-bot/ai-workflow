services:
  db:
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:5.7.44}
    container_name: ai-workflow-db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  app:
    build:
      context: .
      dockerfile: ai-mid-platform/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.12.3-bookworm}
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-mirrors.aliyun.com}
        NODEJS_DIST_MIRROR: ${NODEJS_DIST_MIRROR:-https://npmmirror.com/mirrors/node}
    container_name: ai-workflow-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      CLIENT_PORTAL_AVATAR_DIR: /app/client-portal/avatar
      WF_003_WEBHOOK_URL: http://wf003-worker:3013/webhook/wf003-kie-submit
      WF_003_CALLBACK_BASE_URL: https://www.getrueai.com
      ALIPAY_PRIVATE_KEY_PATH: /run/secrets/payment-keys/app_private_key.pem
      ALIPAY_PUBLIC_KEY_PATH: /run/secrets/payment-keys/alipay_public_key.pem
    depends_on:
      - db
      - wf003-worker
    ports:
      - "3002:3002"
    volumes:
      - ./client-portal/avatar:/app/client-portal/avatar
      - ./secrets/payment-keys:/run/secrets/payment-keys:ro

  web:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20.20.0-bookworm}
        NGINX_BASE_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.24.0}
        WF002_NODE_BASE_IMAGE: ${WF002_NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:24-alpine}
    container_name: ai-workflow-web
    restart: unless-stopped
    depends_on:
      - app
      - wf002-api
      - wf003-worker
    ports:
      - "8080:80"
    volumes:
      - ./client-portal:/srv/portal:ro

  wf002-api:
    image: ${WF002_NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:24-alpine}
    container_name: ai-workflow-wf002-api
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.docker
    command: sh -lc "npm ci && npm run build -w packages/core && npm run build -w apps/api && npm run prisma:generate -w apps/api && npm exec -w apps/api prisma db push -- --schema prisma/schema.prisma && npm run start -w apps/api"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-RootDemo123!}@db:3306/baoyu_image_gen
      DATA_DIR: /app/data
      KIE_IMAGE_MODEL: ${KIE_IMAGE_MODEL:-nano-banana-2}
    depends_on:
      - db
    volumes:
      - ./WF_002/BaoyuSkill:/app
      - wf002_api_node_modules:/app/node_modules
      - ./WF_002/BaoyuSkill/data:/app/data

  wf003-worker:
    build:
      context: .
      dockerfile: WF-003/wf003_worker/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.12.3-bookworm}
    container_name: ai-workflow-wf003-worker
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      KIE_CREATE_TASK_URL: ${KIE_CREATE_TASK_URL:-https://api.kie.ai/api/v1/jobs/createTask}
    depends_on:
      - db
    ports:
      - "3013:3013"

  wf003:
    build:
      context: .
      dockerfile: WF-003/car-export-portal/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20.20.0-bookworm}
    container_name: ai-workflow-wf003
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env.docker
    environment:
      PORT: 3001
      # Override .env.docker's WF_003_WEBHOOK_URL so requests go through the
      # middle-platform container instead of directly to the external n8n webhook.
      WF_003_WEBHOOK_URL: ""
      WF_003_MIDDLE_PLATFORM_URL: http://app:3002/api/v1/workflows/WF-003/json-execute
      CAR_EXPORT_WEBHOOK_URL: ${CAR_EXPORT_WEBHOOK_URL:-}

volumes:
  mysql_data:
  wf002_api_node_modules:
