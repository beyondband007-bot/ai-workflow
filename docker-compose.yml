services:
  db:
    image: mysql:5.7.44
    container_name: ai-workflow-db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  app:
    build:
      context: .
      dockerfile: ai-mid-platform/Dockerfile
    container_name: ai-workflow-app
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      - db
    ports:
      - "3002:3002"

  web:
    image: nginx:1.24.0
    container_name: ai-workflow-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./demo/fristlog.html:/srv/landing/fristlog.html:ro
      - ./demo/case-前端页面设计/login-app/build:/srv/auth:ro
      - ./client-portal:/srv/portal:ro
      - ./deploy/nginx/ai-workflow.docker.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
