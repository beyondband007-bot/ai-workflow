<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WF-001 文生图</title>
    <link rel="stylesheet" href="./styles.css?v=20260428a" />
    <style>
      .wf-page {
        min-height: 100vh;
        padding: 28px 18px 40px;
      }

      .wf-wrap {
        max-width: 1080px;
        margin: 0 auto;
        display: grid;
        gap: 20px;
      }

      .wf-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .wf-head h1 {
        margin: 6px 0 10px;
        color: var(--text);
        font-size: clamp(32px, 5vw, 56px);
      }

      .wf-head p {
        margin: 0;
        max-width: 760px;
        color: var(--muted);
        line-height: 1.7;
      }

      .wf-head-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .wf-head-actions .secondary-button {
        white-space: nowrap;
      }

      .wf-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      .wf-form {
        display: grid;
        gap: 14px;
      }

      .wf-form label {
        display: grid;
        gap: 10px;
        color: var(--text);
        font-weight: 600;
      }

      .wf-ratio-field {
        position: relative;
      }

      .wf-ratio-select {
        position: relative;
      }

      .wf-ratio-trigger {
        width: 100%;
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px 10px 16px;
        border: 1px solid rgba(31, 41, 55, 0.09);
        border-radius: 14px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(248, 250, 252, 0.96));
        color: var(--text);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .wf-ratio-trigger:hover,
      .wf-ratio-trigger:focus-visible {
        outline: none;
        border-color: rgba(25, 197, 107, 0.36);
        box-shadow: 0 0 0 4px rgba(25, 197, 107, 0.1);
      }

      .wf-ratio-trigger svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        transition: transform 160ms ease;
      }

      .wf-ratio-select.is-open .wf-ratio-trigger svg {
        transform: rotate(180deg);
      }

      .wf-ratio-menu {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        z-index: 20;
        display: none;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        padding: 10px;
        border: 1px solid rgba(31, 41, 55, 0.08);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(16px);
      }

      .wf-ratio-select.is-open .wf-ratio-menu {
        display: grid;
      }

      .wf-ratio-option {
        min-height: 72px;
        border: 1px solid rgba(31, 41, 55, 0.08);
        border-radius: 12px;
        background: var(--panel-soft);
        color: var(--text);
        font: inherit;
        cursor: pointer;
        display: grid;
        place-items: center;
        gap: 6px;
        padding: 8px;
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .wf-ratio-option:hover,
      .wf-ratio-option.is-active {
        border-color: rgba(25, 197, 107, 0.38);
        background: rgba(25, 197, 107, 0.08);
      }

      .wf-ratio-option.is-active {
        box-shadow: inset 0 0 0 1px rgba(25, 197, 107, 0.18);
      }

      .wf-ratio-preview {
        width: 28px;
        height: 28px;
        border: 2px solid currentColor;
        border-radius: 5px;
        opacity: 0.75;
      }

      .wf-ratio-preview[data-ratio="4:3"] {
        width: 34px;
      }

      .wf-ratio-preview[data-ratio="3:4"] {
        height: 36px;
      }

      .wf-ratio-preview[data-ratio="16:9"] {
        width: 40px;
        height: 24px;
      }

      .wf-ratio-preview[data-ratio="9:16"] {
        width: 24px;
        height: 40px;
      }

      .wf-ratio-text {
        font-size: 14px;
        font-weight: 700;
      }

      .wf-form textarea {
        width: 100%;
        min-height: 170px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel-soft);
        color: var(--text);
        padding: 16px 18px;
        font: inherit;
      }

      .wf-form textarea::placeholder {
        color: var(--muted);
      }

      .wf-form textarea:focus {
        outline: none;
        border-color: rgba(25, 197, 107, 0.46);
        box-shadow: 0 0 0 4px rgba(25, 197, 107, 0.14);
      }

      .wf-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .wf-status {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .wf-status-card {
        border-radius: 18px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        padding: 16px;
      }

      .wf-status-card span {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .wf-status-card strong {
        display: block;
        margin-top: 8px;
        color: var(--text);
        font-size: 20px;
        word-break: break-word;
      }

      .wf-summary {
        color: var(--text);
        margin: 0 0 16px;
      }

      .wf-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 18px;
        margin-top: 22px;
      }

      .wf-gallery-item {
        overflow: hidden;
        border-radius: 24px;
        border: 1px solid var(--line);
        background: var(--panel-soft);
      }

      .wf-gallery-item img {
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        display: block;
      }

      .wf-gallery-item a {
        display: block;
        padding: 12px;
        color: var(--teal);
        text-decoration: none;
      }

      .wf-empty {
        margin-top: 18px;
        padding: 56px 24px;
        border-radius: 18px;
        border: 1px dashed var(--line);
        color: var(--muted);
        text-align: center;
      }

      body[data-theme="dark"] .wf-summary {
        color: #cfe2f6;
      }

      body[data-theme="dark"] .wf-form textarea {
        background: rgba(8, 21, 36, 0.84);
      }

      body[data-theme="dark"] .wf-ratio-trigger,
      body[data-theme="dark"] .wf-ratio-menu,
      body[data-theme="dark"] .wf-ratio-option {
        border-color: rgba(74, 228, 198, 0.16);
        background: rgba(8, 21, 36, 0.92);
      }

      body[data-theme="dark"] .wf-ratio-menu {
        box-shadow: 0 18px 40px rgba(2, 8, 14, 0.45);
      }

      body[data-theme="dark"] .wf-ratio-option:hover,
      body[data-theme="dark"] .wf-ratio-option.is-active {
        border-color: rgba(114, 255, 214, 0.34);
        background: rgba(79, 165, 116, 0.12);
      }

      @media (max-width: 860px) {
        .wf-head {
          flex-direction: column;
        }

        .wf-head-actions {
          width: 100%;
          justify-content: flex-start;
        }

        .wf-status {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .wf-ratio-menu {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .wf-status {
          grid-template-columns: 1fr;
        }

        .wf-ratio-menu {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <main class="wf-page">
      <div class="wf-wrap">
        <header class="wf-head">
          <div>
            <p class="eyebrow">Text-to-Image Workflow</p>
            <h1>文生图工作流</h1>
            <p>高性价比文生图工作流，支持多种图像比例选择。图片仅保证7天有效，请及时下载保存。</p>
          </div>
          <div class="wf-head-actions">
            <a class="secondary-button" id="historyLink" href="./wf001_record.html">历史记录</a>
            <a class="secondary-button" id="backLink" href="./index.html">返回门户</a>
          </div>
        </header>

        <section class="wf-panel">
          <form class="wf-form" id="wf001Form">
            <label for="promptInput">
              提示词
              <textarea id="promptInput" placeholder="例如：生成一张电影感很强的中国美女写真，柔光，细节清晰，时尚杂志风格。"></textarea>
            </label>
            <label class="wf-ratio-field" for="aspectRatioSelect">
              图像比例
              <input id="aspectRatioSelect" type="hidden" value="3:4" />
              <div class="wf-ratio-select" id="aspectRatioPicker">
                <button class="wf-ratio-trigger" id="aspectRatioTrigger" type="button" aria-expanded="false" aria-haspopup="listbox">
                  <span id="aspectRatioLabel">3:4</span>
                  <svg viewBox="0 0 20 20" focusable="false" aria-hidden="true">
                    <path d="m5 7.5 5 5 5-5"></path>
                  </svg>
                </button>
                <div class="wf-ratio-menu" id="aspectRatioMenu" role="listbox" aria-label="图像比例">
                  <button class="wf-ratio-option" type="button" role="option" data-ratio="1:1" aria-selected="false">
                    <span class="wf-ratio-preview" data-ratio="1:1"></span>
                    <span class="wf-ratio-text">1:1</span>
                  </button>
                  <button class="wf-ratio-option" type="button" role="option" data-ratio="4:3" aria-selected="false">
                    <span class="wf-ratio-preview" data-ratio="4:3"></span>
                    <span class="wf-ratio-text">4:3</span>
                  </button>
                  <button class="wf-ratio-option is-active" type="button" role="option" data-ratio="3:4" aria-selected="true">
                    <span class="wf-ratio-preview" data-ratio="3:4"></span>
                    <span class="wf-ratio-text">3:4</span>
                  </button>
                  <button class="wf-ratio-option" type="button" role="option" data-ratio="16:9" aria-selected="false">
                    <span class="wf-ratio-preview" data-ratio="16:9"></span>
                    <span class="wf-ratio-text">16:9</span>
                  </button>
                  <button class="wf-ratio-option" type="button" role="option" data-ratio="9:16" aria-selected="false">
                    <span class="wf-ratio-preview" data-ratio="9:16"></span>
                    <span class="wf-ratio-text">9:16</span>
                  </button>
                </div>
              </div>
            </label>
            <div class="wf-actions">
              <button class="primary-button" id="submitButton" type="submit">开始生成</button>
              <button class="secondary-button" id="fillDemoPrompt" type="button">填入示例</button>
            </div>
          </form>
        </section>

        <section class="wf-panel">
          <div class="wf-status">
            <article class="wf-status-card">
              <span>任务 ID</span>
              <strong id="runIdValue">-</strong>
            </article>
            <article class="wf-status-card">
              <span>状态</span>
              <strong id="runStatusValue">未开始</strong>
            </article>
            <article class="wf-status-card">
              <span>计费</span>
              <strong id="billingStatusValue">-</strong>
            </article>
            <article class="wf-status-card">
              <span>消耗积分</span>
              <strong id="chargePointsValue">0</strong>
            </article>
          </div>

          <p class="wf-summary" id="summaryText">任务执行摘要</p>
          <div class="wf-gallery" id="resultGallery"></div>
          <div class="wf-empty" id="resultEmpty">图片生成完成后会显示在这里</div>
        </section>
      </div>
    </main>

    <script src="./auth-state.js?v=20260509a"></script>
    <script src="./wf001.js?v=20260511a"></script>
  </body>
</html>
