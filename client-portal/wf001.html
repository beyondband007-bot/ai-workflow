<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WF-001 文生图</title>
    <link rel="stylesheet" href="./styles.css?v=20260428a" />
    <style>
      .wf-page {
        min-height: 100vh;
        padding: 28px 18px 40px;
      }

      .wf-wrap {
        max-width: 1080px;
        margin: 0 auto;
        display: grid;
        gap: 20px;
      }

      .wf-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .wf-head h1 {
        margin: 6px 0 10px;
        color: var(--text);
        font-size: clamp(32px, 5vw, 56px);
      }

      .wf-head p {
        margin: 0;
        max-width: 760px;
        color: var(--muted);
        line-height: 1.7;
      }

      .wf-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      .wf-form {
        display: grid;
        gap: 14px;
      }

      .wf-form label {
        display: grid;
        gap: 10px;
        color: var(--text);
        font-weight: 600;
      }

      .wf-form textarea {
        width: 100%;
        min-height: 170px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel-soft);
        color: var(--text);
        padding: 16px 18px;
        font: inherit;
      }

      .wf-form textarea::placeholder {
        color: var(--muted);
      }

      .wf-form textarea:focus {
        outline: none;
        border-color: rgba(25, 197, 107, 0.46);
        box-shadow: 0 0 0 4px rgba(25, 197, 107, 0.14);
      }

      .wf-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .wf-status {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .wf-status-card {
        border-radius: 18px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        padding: 16px;
      }

      .wf-status-card span {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .wf-status-card strong {
        display: block;
        margin-top: 8px;
        color: var(--text);
        font-size: 20px;
        word-break: break-word;
      }

      .wf-summary {
        color: var(--text);
        margin: 0 0 16px;
      }

      .wf-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 18px;
        margin-top: 22px;
      }

      .wf-gallery-item {
        overflow: hidden;
        border-radius: 24px;
        border: 1px solid var(--line);
        background: var(--panel-soft);
      }

      .wf-gallery-item img {
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        display: block;
      }

      .wf-gallery-item a {
        display: block;
        padding: 12px;
        color: var(--teal);
        text-decoration: none;
      }

      .wf-empty {
        margin-top: 18px;
        padding: 56px 24px;
        border-radius: 18px;
        border: 1px dashed var(--line);
        color: var(--muted);
        text-align: center;
      }

      body[data-theme="dark"] .wf-summary {
        color: #cfe2f6;
      }

      body[data-theme="dark"] .wf-form textarea {
        background: rgba(8, 21, 36, 0.84);
      }

      @media (max-width: 860px) {
        .wf-head {
          flex-direction: column;
        }

        .wf-status {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .wf-status {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <main class="wf-page">
      <div class="wf-wrap">
        <header class="wf-head">
          <div>
            <p class="eyebrow">WF-001</p>
            <h1>文生图工作流</h1>
            <p>这个页面只保留最小闭环：输入提示词，观察中台执行日志，等待图片生成并确认本次积分结算结果。</p>
          </div>
          <a class="secondary-button" id="backLink" href="./index.html">返回门户</a>
        </header>

        <section class="wf-panel">
          <form class="wf-form" id="wf001Form">
            <label for="promptInput">
              提示词
              <textarea id="promptInput" placeholder="例如：生成一张电影感很强的中国美女写真，柔光，细节清晰，时尚杂志风格。"></textarea>
            </label>
            <label for="aspectRatioSelect">
              图像比例
              <select id="aspectRatioSelect">
                <option value="1:1">1:1</option>
                <option value="4:3">4:3</option>
                <option value="3:4" selected>3:4</option>
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
              </select>
            </label>
            <div class="wf-actions">
              <button class="primary-button" id="submitButton" type="submit">开始生成</button>
              <button class="secondary-button" id="fillDemoPrompt" type="button">填入示例</button>
            </div>
          </form>
        </section>

        <section class="wf-panel">
          <div class="wf-status">
            <article class="wf-status-card">
              <span>run id</span>
              <strong id="runIdValue">-</strong>
            </article>
            <article class="wf-status-card">
              <span>status</span>
              <strong id="runStatusValue">未开始</strong>
            </article>
            <article class="wf-status-card">
              <span>billing</span>
              <strong id="billingStatusValue">-</strong>
            </article>
            <article class="wf-status-card">
              <span>charge points</span>
              <strong id="chargePointsValue">0</strong>
            </article>
          </div>

          <p class="wf-summary" id="summaryText">提交任务后，这里会显示执行摘要。</p>
          <div class="wf-gallery" id="resultGallery"></div>
          <div class="wf-empty" id="resultEmpty">图片生成完成后会显示在这里。</div>
        </section>
      </div>
    </main>

    <script src="./wf001.js?v=20260428a"></script>
  </body>
</html>
