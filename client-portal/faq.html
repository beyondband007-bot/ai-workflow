<script>
(() => {
	const THEME_KEY = "client_portal_theme";
	const body = document.body;
	const toggleButton = document.getElementById("themeToggle");

	if (!body || !toggleButton) {
		return;
	}

	const toggleLabel = toggleButton.querySelector(".theme-toggle-label");

	function applyTheme(theme) {
		const nextTheme = theme === "dark" ? "dark" : "light";
		const isDark = nextTheme === "dark";
		body.dataset.theme = nextTheme;
		toggleButton.setAttribute("aria-pressed", String(isDark));
		if (toggleLabel) {
			toggleLabel.textContent = isDark ? "夜间模式" : "白天模式";
		}
		window.localStorage.setItem(THEME_KEY, nextTheme);
	}

	const savedTheme = window.localStorage.getItem(THEME_KEY);
	applyTheme(savedTheme || "light");

	toggleButton.addEventListener("click", () => {
		applyTheme(body.dataset.theme === "dark" ? "light" : "dark");
	});
})();
</script>

      { q: "忘记密码怎么办？", a: "请联系运营支持重置密码，或联系您的商务对接人协助处理。" },
      { q: "如何开通【跨境电商图生图】权限？", a: "【跨境电商图生图】为增值功能，需联系商务开通。开通后会自动绑定您的账户，无需额外配置。" },
      { q: "可以绑定多个用户吗？", a: "每个账户独立管理积分和权限。如需子账户或团队协作，请联系商务开通企业版方案。" },
    ],
  };

  function renderFaq(category) {
    const list = document.getElementById("faqList");
    const items = builtinFaq[category] || [];
    if (items.length === 0) {
      list.innerHTML = `
        <div class="faq-empty">
          <div style="font-size: 32px; margin-bottom: 8px;">📝</div>
          <h4 style="margin: 0 0 6px; font-size: 16px; color: var(--text);">该分类下暂无问题</h4>
          <p style="margin: 0; font-size: 14px;">内容正在整理中，即将补充上线。</p>
        </div>
      `;
      return;
    }
    list.innerHTML = items.map((item, index) => `
      <details class="faq-item" name="faq" ${index === 0 ? "open" : ""}>
        <summary class="faq-question">
          <span>${item.q}</span>
          <span class="faq-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M5 8.5 12 15.5 19 8.5"></path>
            </svg>
          </span>
        </summary>
        <div class="faq-answer">${item.a}</div>
      </details>
    `).join("");
  }

  function attachTabs() {
    const tabs = document.getElementById("faqTabs");
    if (!tabs) return;
    tabs.addEventListener("click", (e) => {
      const tab = e.target.closest("[data-category]");
      if (!tab) return;
      tabs.querySelectorAll(".faq-tab").forEach((t) => t.classList.remove("is-active"));
      tab.classList.add("is-active");
      renderFaq(tab.dataset.category);
    });
  }

  renderFaq("hot");
  attachTabs();
})();
</script>
