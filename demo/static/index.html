<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Demo</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="page">
        <section class="hero">
            <p class="eyebrow">FastAPI + MySQL + JWT</p>
            <h1>登录系统演示页</h1>
            <p class="subtitle">
                这个页面直接连接当前后端接口，支持注册、登录、查看当前用户信息和退出登录。
            </p>
            <div class="hero-actions">
                <a href="/docs" target="_blank" rel="noreferrer">查看 Swagger</a>
                <a href="/" target="_blank" rel="noreferrer">健康检查</a>
            </div>
        </section>

        <section class="panel-grid">
            <article class="card">
                <div class="card-header">
                    <h2>注册</h2>
                    <p>创建一个新账号</p>
                </div>
                <form id="register-form" class="form">
                    <label>
                        <span>邮箱</span>
                        <input type="email" name="email" placeholder="you@example.com" required>
                    </label>
                    <label>
                        <span>用户名</span>
                        <input type="text" name="username" placeholder="demo_user" required>
                    </label>
                    <label>
                        <span>密码</span>
                        <input type="password" name="password" placeholder="至少 6 位" required minlength="6">
                    </label>
                    <button type="submit">注册账号</button>
                </form>
            </article>

            <article class="card">
                <div class="card-header">
                    <h2>登录</h2>
                    <p>登录后会自动保存 token</p>
                </div>
                <form id="login-form" class="form">
                    <label>
                        <span>邮箱</span>
                        <input type="email" name="email" placeholder="you@example.com" required>
                    </label>
                    <label>
                        <span>密码</span>
                        <input type="password" name="password" placeholder="请输入密码" required>
                    </label>
                    <button type="submit">登录</button>
                </form>
            </article>

            <article class="card card-wide">
                <div class="card-header">
                    <h2>当前会话</h2>
                    <p>这里会显示 token 和当前登录用户信息</p>
                </div>
                <div class="actions">
                    <button id="load-me" type="button" class="secondary">获取当前用户</button>
                    <button id="logout" type="button" class="ghost">退出登录</button>
                </div>

                <div class="status-block">
                    <div>
                        <h3>登录状态</h3>
                        <p id="session-status" class="session-status">未登录</p>
                    </div>
                    <div>
                        <h3>Access Token</h3>
                        <pre id="token-output" class="code-block">暂无 token</pre>
                    </div>
                    <div>
                        <h3>用户信息</h3>
                        <pre id="me-output" class="code-block">暂无用户数据</pre>
                    </div>
                    <div>
                        <h3>操作结果</h3>
                        <pre id="message-output" class="code-block">页面已就绪</pre>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
